<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Siddhartha — Ser parte de tu ser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fondo: la portada del álbum, difuminada y oscurecida -->
  <div class="fondo" style="background-image: url('assets/cover.jpg');"></div>
  <div class="fondo-velo"></div>

  <main class="escenario">

    <p class="etiqueta">Ahora suena</p>
    <h1 class="titulo">Ser parte de tu ser</h1>
    <p class="artista">Siddhartha — Únicos</p>

    <!-- ===================== TOCADISCOS ===================== -->
    <div class="tocadiscos">

      <div class="base-madera">

        <!-- Brazo con la aguja -->
        <div class="brazo" id="brazo">
          <div class="brazo-pivote"></div>
          <div class="brazo-tubo"></div>
          <div class="brazo-cabezal"></div>
        </div>

        <!-- Plato giratorio -->
        <div class="plato">
          <div class="disco" id="disco">
            <div class="surcos"></div>
            <div class="etiqueta-vinilo" style="background-image: url('assets/cover.jpg');">
              <div class="hoyo-central"></div>
            </div>
          </div>
        </div>

      </div>

      <!-- ===================== CONTROLES ===================== -->
      <div class="controles">

        <button class="btn-transporte" id="btn-atras" aria-label="Retroceder 10 segundos" title="Retroceder 10s">
          <svg viewBox="0 0 24 24"><path d="M11 5V1L5 7l6 6V9c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H3c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
        </button>

        <button class="btn-play" id="btn-play" aria-label="Reproducir">
          <svg id="icono-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icono-pausa" viewBox="0 0 24 24" class="oculto"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
        </button>

        <button class="btn-transporte" id="btn-adelante" aria-label="Adelantar 10 segundos" title="Adelantar 10s">
          <svg viewBox="0 0 24 24"><path d="M13 5V1l6 6-6 6V9c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>
        </button>

      </div>

      <!-- Barra de progreso -->
      <div class="progreso-fila">
        <span class="tiempo" id="tiempo-actual">0:00</span>
        <input type="range" id="barra-progreso" class="barra-progreso" min="0" max="100" value="0" step="0.1" aria-label="Progreso de la canción">
        <span class="tiempo" id="tiempo-total">0:00</span>
      </div>

      <!-- Volumen -->
      <div class="fila-volumen">
        <svg class="icono-volumen" viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <input type="range" id="barra-volumen" class="barra-volumen" min="0" max="100" value="80" aria-label="Volumen">
      </div>

    </div>

  </main>

  <!-- CAMBIAR AQUÍ: ruta del archivo de audio -->
  <audio id="audio" src="assets/cancion.m4a" preload="metadata"></audio>

  <script src="script.js"></script>
</body>
</html>
